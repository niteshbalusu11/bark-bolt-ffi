name: SDK and native apps
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  RUSTUP_TOOLCHAIN: 1.90.0
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake pkg-config libssl-dev
      - run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-
      - run: python3 scripts/swift-artifact.py
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo install cargo-audit --version 0.22.2 --locked && cargo audit
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake pkg-config libssl-dev
      - run: rustup toolchain install 1.90.0 --profile minimal
      - run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '11076708'
          packages: 'platform-tools'
      - run: sdkmanager 'ndk;28.2.13676358' 'platforms;android-35' 'build-tools;35.0.0'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.gradle/caches
            ~/.gradle/wrapper
            target
          key: android-${{ runner.os }}-${{ hashFiles('Cargo.lock', '**/*.gradle.kts') }}
          restore-keys: android-${{ runner.os }}-
      - run: scripts/install-boltffi.sh
      - run: BOLTFFI="$PWD/target/tools/boltffi" scripts/build-sdk.sh android --release
      - run: target/tools/boltffi generate swift --deny-skipped && python3 scripts/check-api.py
      - run: ./gradlew :sdk:android:assembleRelease :sdk:jvm:test :sdk:jvm:jar :sdk:jvm:testPackaged :examples:android:assembleRelease :examples:android:assembleDebug :examples:android:assembleDebugAndroidTest
      - run: python3 scripts/check-kotlin-artifacts.py
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: python3 scripts/regtest.py start
      - uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            ./gradlew :examples:android:connectedDebugAndroidTest
            BARK_REGTEST=1 ./gradlew :sdk:jvm:test :sdk:jvm:testPackaged
            adb install -r examples/android/build/outputs/apk/debug/android-debug.apk
            python3 scripts/app-regtest.py --platform android
      - if: always()
        run: docker compose -f regtest/compose.yaml logs --tail=200 > regtest.log
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-sdk-app-reports
          retention-days: 3
          path: |
            sdk/android/build/outputs/aar/*.aar
            sdk/jvm/build/libs/*.jar
            sdk/jvm/build/reports/tests
            examples/android/build/outputs/apk
            examples/android/build/reports
            regtest.log
  apple:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: brew install protobuf xcodegen
      - run: rustup toolchain install 1.90.0 --profile minimal
      - run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios aarch64-apple-darwin x86_64-apple-darwin
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: apple-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: apple-${{ runner.arch }}-
      - run: scripts/install-boltffi.sh
      - run: BOLTFFI="$PWD/target/tools/boltffi" scripts/build-sdk.sh apple --release
      - run: python3 scripts/swift-artifact.py --check-build
      - run: swift test --package-path tests/swift
      - run: xcodegen generate --spec examples/ios/project.yml
      - name: Test iOS app
        run: |
          IOS_DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if "iPhone" in d["name"]))')
          xcodebuild -project examples/ios/BarkExample.xcodeproj -scheme BarkExample -destination "platform=iOS Simulator,id=$IOS_DEVICE" -derivedDataPath build/ios -resultBundlePath build/ios-tests.xcresult test
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: apple-sdk-app-reports
          retention-days: 3
          path: |
            dist/apple
            build/ios/Build/Products/Debug-iphonesimulator/*.app
            build/ios-tests.xcresult
