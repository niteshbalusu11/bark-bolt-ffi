name: SDK and native apps
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  RUSTUP_TOOLCHAIN: 1.90.0
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake pkg-config libssl-dev just jq shellcheck
      - run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-
      - run: python3 scripts/swift-artifact.py
      - if: github.ref_type == 'tag'
        run: python3 scripts/swift-artifact.py --check-source
      - run: python3 -m unittest discover -s tests/python -v
      - run: shellcheck scripts/ark-dev.sh tests/shell/ark-dev.sh && bash tests/shell/ark-dev.sh
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo install cargo-audit --version 0.22.2 --locked && cargo audit
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake pkg-config libssl-dev just jq
      - run: rustup toolchain install 1.90.0 --profile minimal
      - run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '11076708'
          packages: 'platform-tools'
      - run: sdkmanager 'ndk;28.2.13676358' 'platforms;android-35' 'build-tools;35.0.0'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.gradle/caches
            ~/.gradle/wrapper
            target
          key: android-${{ runner.os }}-${{ hashFiles('Cargo.lock', '**/*.gradle.kts') }}
          restore-keys: android-${{ runner.os }}-
      - run: scripts/install-boltffi.sh
      - run: BOLTFFI="$PWD/target/tools/boltffi" just build-android --release
      - run: target/tools/boltffi generate swift --deny-skipped && python3 scripts/check-api.py
      - run: ./gradlew :sdk:android:assembleRelease :sdk:jvm:test :sdk:jvm:jar :sdk:jvm:testPackaged :examples:android:assembleRelease :examples:android:assembleDebug :examples:android:assembleDebugAndroidTest
      - run: python3 scripts/check-kotlin-artifacts.py
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: just setup-everything
      - run: BARK_REGTEST=1 cargo test --locked
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            ./gradlew :examples:android:connectedDebugAndroidTest
            BARK_REGTEST=1 ./gradlew :sdk:jvm:test :sdk:jvm:testPackaged
            adb install -r examples/android/build/outputs/apk/debug/android-debug.apk
            just test-regtest --platform android
      - if: always()
        run: just logs --tail=200 > regtest.log
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-sdk-app-reports
          retention-days: 3
          path: |
            sdk/android/build/outputs/aar/*.aar
            sdk/jvm/build/libs/*.jar
            sdk/jvm/build/reports/tests
            examples/android/build/outputs/apk
            examples/android/build/reports
            regtest.log
  apple:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: brew install protobuf xcodegen just
      - run: rustup toolchain install 1.90.0 --profile minimal
      - run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios aarch64-apple-darwin x86_64-apple-darwin
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: apple-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: apple-${{ runner.arch }}-
      - run: scripts/install-boltffi.sh
      - run: BOLTFFI="$PWD/target/tools/boltffi" just build-ios --release
      - run: python3 scripts/swift-artifact.py --check-build
      - run: swift test --package-path tests/swift
      - run: xcodegen generate --spec examples/ios/project.yml
      - name: Test iOS app
        run: |
          IOS_DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if "iPhone" in d["name"]))')
          xcodebuild -project examples/ios/BarkExample.xcodeproj -scheme BarkExample -destination "platform=iOS Simulator,id=$IOS_DEVICE" -derivedDataPath build/ios -resultBundlePath build/ios-tests.xcresult test
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-sdk-app-reports
          retention-days: 3
          path: |
            dist/apple
            build/ios/Build/Products/Debug-iphonesimulator/*.app
            build/ios-tests.xcresult
